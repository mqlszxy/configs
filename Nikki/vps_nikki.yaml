# DNS防泄露版本
# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅

# 自选节点
customize: &customize {type: select, include-all: true}

proxy-providers:
  VPS:
    url: "订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🔗 直连

# 节点信息
proxies:
  - {name: 🔗 直连, type: direct}
  - {name: 🚫 拒绝, type: reject}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
#sniffer:
#  enable: true
#  sniff:
#    HTTP:
#      ports: [80, 8080-8880]
#      override-destination: true
#    TLS:
#      ports: [443, 8443]
#    QUIC:
#      ports: [443, 8443]
#  skip-domain:
#    - "Mijia Cloud"
#    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  resolve-concurrent: true                                      # DNS并发解析开关
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://8.8.8.8/dns-query


# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  # 策略
  - {name: 🔍 Google, <<: *customize}
  - {name: 📲 Telegram, <<: *customize}
  - {name: 🤖 AI, <<: *customize}
  - {name: 💻 Github, <<: *customize}
  - {name: 🖥️ Cloudflare, <<: *customize}
  - {name: 📹 YouTube, <<: *customize}
  - {name: 🍎 Apple, <<: *customize}
  - {name: 🎮 游戏, <<: *customize}
  - {name: 🪟 Microsoft, <<: *customize}
  - {name: 🎥 TikTok, <<: *customize}
  - {name: 📺 Netflix, <<: *customize}
  - {name: 🏰 Disney, <<: *customize}
  - {name: 🎞️ HBO Max, <<: *customize}
  - {name: 📽️ Apple TV, <<: *customize}
  - {name: 🎧 Spotify, <<: *customize}
  - {name: 🐦 Twitter / X, <<: *customize}
  - {name: 👽 Reddit, <<: *customize}
  - {name: 💬 WhatsApp, <<: *customize}
  - {name: 💶 PayPal, <<: *customize}
  - {name: 🛡️ 流量净化, <<: *customize}
  - {name: 📡 消息推送, <<: *customize}
  - {name: 🔗 直连服务, <<: *customize}
  - {name: 🚀 外网兜底, <<: *customize}
  - {name: 🧯 全局兜底, <<: *customize}
  
# 规则匹配
rules:
  # 🛡️ 流量净化 (按危险优先级排序)
  - RULE-SET,google_ads_domain,🛡️ 流量净化                 # 谷歌广告
  - RULE-SET,disney_ads_domain,🛡️ 流量净化                 # disney广告
  - RULE-SET,apple_ads_domain,🛡️ 流量净化                  # apple广告
  - RULE-SET,ad_domain,🛡️ 流量净化                         # 广告
  # 📡 消息推送
  - RULE-SET,google_fcm_domain,📡 消息推送                 # GoogleFCM
  # 内网直连
  - RULE-SET,private_ip,🔗 直连服务,no-resolve
  - RULE-SET,private_domain,🔗 直连服务
  # 💶 PayPal
  - RULE-SET,paypal_domain,💶 PayPal
  # 📲 Telegram
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
