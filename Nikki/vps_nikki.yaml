  - RULE-SET,media_domain_cn,🔗 直连服务
  # 国内直连ip
  - RULE-SET,cn_ip,🔗 直连服务
  # 游戏直连服务
  - RULE-SET,games_domain_cn,🔗 直连服务
  - RULE-SET,steam_cn_domain,🔗 直连服务                   # steam直连
  - RULE-SET,nintendo_cn_domain,🔗 直连服务                # 任天堂直连
  # 苹果直连服务
