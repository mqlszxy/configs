  # 💬 WhatsApp
  - RULE-SET,whatsapp_domain,💬 WhatsApp
  # 🪟 Microsoft
  - RULE-SET,microsoft_cn_domain,🪟 Microsoft
  # 🔍 Google
  - RULE-SET,google_scholar_domain,🔍 Google 
  - RULE-SET,google_gemini_domain,🔍 Google
  - RULE-SET,google_play_domain,🔍 Google
  - RULE-SET,google_ip,🔍 Google,no-resolve
  - RULE-SET,google_domain,🔍 Google
    # 国内直连域名
  - RULE-SET,cn_domain,🔗 直连服务
